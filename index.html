function toggleAdmin(){admin=!admin;render();}
function addMatch(){let h=prompt("Домакин:"); if(!h) return; let a=prompt("Гост:"); if(!a) return; let d=prompt("Дата:")||new Date().toISOString().slice(0,10); let t=prompt("Час:")||"10:00"; let l=prompt("Лига:")||""; let g=prompt("Група:")||activeTeam; data.matches.push({id:Date.now(),home:h,away:a,date:d,time:t,league:l,group:g,status:"предстоящ",result:""}); save(); render();}
function editMatch(id){let m=data.matches.find(x=>x.id===id); m.result=prompt("Резултат:",m.result)||m.result; m.status=prompt("Статус:",m.status)||m.status; m.date=prompt("Дата:",m.date)||m.date; save(); render();}
function deleteMatch(id){if(!confirm("Изтрий?"))return; data.matches=data.matches.filter(x=>x.id!==id); save(); render();}
function addNews(){let t=prompt("Заглавие:"); if(!t) return; let c=prompt("Текст:")||""; let i=prompt("Снимка линк:")||""; data.news.unshift({id:Date.now(),title:t,content:c,img:i,date:new Date().toISOString().slice(0,10)}); save(); render();}
function editNews(id){let n=data.news.find(x=>x.id===id); n.title=prompt("Заглавие:",n.title)||n.title; n.content=prompt("Текст:",n.content)||n.content; n.img=prompt("Линк:",n.img)||n.img; save(); render();}
function deleteNews(id){if(!confirm("Изтрий?"))return; data.news=data.news.filter(x=>x.id!==id); save(); render();}
function addMedia(){let u=prompt("Линк снимка:"); if(!u) return; data.media.push(u); save(); render();}
function deleteMedia(i){data.media.splice(i,1); save(); render();}
function addPlayer(){let n=prompt("Име:"); if(!n) return; let num=prompt("Номер:")||""; let pos=prompt("Позиция:")||""; if(!data.players[activeTeam]) data.players[activeTeam]=[]; data.players[activeTeam].push({name:n,number:num,position:pos}); save(); render();}
function editPlayer(t,i){let p=data.players[t][i]; p.name=prompt("Име:",p.name)||p.name; p.number=prompt("Номер:",p.number)||p.number; p.position=prompt("Позиция:",p.position)||p.position; save(); render();}
function deletePlayer(t,i){if(!confirm("Изтрий?"))return; data.players[t].splice(i,1); save(); render();}
function addStaff(){let n=prompt("Име:"); if(!n) return; let r=prompt("Роля:")||""; let tm=prompt("Отговаря за:")||""; data.staff.push({name:n,role:r,teams:tm}); save(); render();}
function editStaff(i){let s=data.staff[i]; s.name=prompt("Име:",s.name)||s.name; s.role=prompt("Роля:",s.role)||s.role; s.teams=prompt("Отговаря за:",s.teams)||s.teams; save(); render();}
function deleteStaff(i){if(!confirm("Изтрий?"))return; data.staff.splice(i,1); save(); render();}
function exportJSON(){let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); let u=URL.createObjectURL(b); let a=document.createElement('a'); a.href=u; a.download='levski2000-backup.json'; a.click();}
function importJSON(){let inp=document.createElement('input'); inp.type='file'; inp.accept='.json'; inp.onchange=e=>{let f=e.target.files[0]; let r=new FileReader(); r.onload=()=>{try{data=JSON.parse(r.result); save(); render(); alert('Успех')}catch{alert('Грешка')}}; r.readAsText(f);}; inp.click();}
render();
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.proto ifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
